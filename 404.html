<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=https://tgcc-lineup.github.io/" />
  <link rel="canonical" href="https://tgcc-lineup.github.io/" />
  <title>Redirecting… TGCC Line-up</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0d0f14; color: #9ca3af; font-family: sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    a { color: #f5c842; }
  </style>
  <script>
    // Make sure no stale service worker keeps serving the old cached app instead of this redirect.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
    }
    window.location.replace('https://tgcc-lineup.github.io/');
  </script>
</head>
<body>
  <p>This page has moved. Redirecting to <a href="https://tgcc-lineup.github.io/">tgcc-lineup.github.io</a>…</p>
</body>
</html>
